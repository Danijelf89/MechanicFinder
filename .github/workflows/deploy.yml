# Build Angular aplikacije i objava na GitHub Pages pri svakom push-u na main.
# Adresa: https://servisradar.rs/
name: Deploy na GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Sajt živi u korenu sopstvenog domena (servisradar.rs), pa je base-href "/"
      - run: npx ng build --configuration production --base-href /

      # GitHub Pages ne zna za Angular rute: direktno otvaranje /mapa bi dalo 404.
      # Kopija index.html kao 404.html učitava aplikaciju, a Angular router onda prikaže pravu stranu.
      - run: cp dist/majstor-blizu/browser/index.html dist/majstor-blizu/browser/404.html

      # Custom domen za GitHub Pages
      - run: echo "servisradar.rs" > dist/majstor-blizu/browser/CNAME

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/majstor-blizu/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
